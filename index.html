<!doctype html>
<html lang="uk">
  <head>
    <meta charset="UTF-8" />
    <!-- resizes-content: клавиатура Android сжимает layout viewport; без этого она перекрывает
         всё, что прибито к низу экрана (поле ввода, шторки, кнопки). -->
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1.0, viewport-fit=cover, interactive-widget=resizes-content"
    />
    <meta name="theme-color" content="#121419" />
    <title>Daylist</title>
    <style>
      /* Фон до загрузки JS, чтобы при старте PWA не мигал белый экран. */
      html {
        background: #121419;
      }
    </style>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
